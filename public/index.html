<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Destek Merkezi</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body { 
            background: #1a1a2e; 
            color: #fff; 
            height: 100dvh;
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            padding-top: 50px;
        }

        /* ÜST BAR - SABİT */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: #2d2d44;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #444;
            z-index: 9000;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .logo-text {
            font-weight: 600;
            font-size: 15px;
            color: #667eea;
            white-space: nowrap;
        }

        .search-container {
            flex: 1;
            max-width: 400px;
            margin: 0 5px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 8px 30px 8px 12px;
            border: 1px solid #444;
            border-radius: 20px;
            background: #1a1a2e;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
        }

        .search-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            pointer-events: none;
            opacity: 0.6;
        }

        .online-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #27ae60;
            white-space: nowrap;
        }

        .online-dot {
            width: 7px;
            height: 7px;
            background: #27ae60;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* YILAN OYUNU */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
            overflow-y: auto;
        }

        .game-header {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: 600;
            flex-wrap: wrap;
            justify-content: center;
        }

        .score-display { color: #667eea; }
        .best-score-display { color: #f39c12; }

        .canvas-wrapper {
            position: relative;
            background: #000;
            border-radius: 10px;
            border: 2px solid #333;
            overflow: hidden;
            max-width: 100%;
            max-height: 60dvh;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            max-width: 400px;
            max-height: 60dvh;
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .game-overlay.hidden { display: none; }

        .overlay-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #667eea;
        }

        .overlay-subtitle {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 15px;
        }

        .overlay-score {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary { background: #667eea; color: #fff; }
        .btn-primary:hover { background: #5568d3; transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }

        .game-hint {
            margin-top: 10px;
            color: #666;
            font-size: 12px;
            text-align: center;
        }

        .mobile-controls {
            display: none;
            margin-top: 10px;
            gap: 5px;
        }

        .mobile-btn {
            width: 45px;
            height: 45px;
            background: #2d2d44;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-btn:active { background: #667eea; }

        .mobile-row {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .mobile-controls { display: flex; flex-direction: column; align-items: center; }
        }

        /* PROFİL MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: #2d2d44;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid #444;
            max-height: 80dvh;
            overflow-y: auto;
        }

        .modal h2 {
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
            font-size: 18px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-size: 12px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .form-input:focus { border-color: #667eea; }

        .photo-preview {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 8px;
            display: block;
            object-fit: cover;
            border: 2px solid #667eea;
            cursor: pointer;
            background: #1a1a2e;
        }

        .photo-btn {
            width: 100%;
            padding: 7px;
            background: #1a1a2e;
            border: 1px dashed #444;
            border-radius: 8px;
            color: #ccc;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
        }

        .btn-full {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-full:disabled { background: #444; cursor: not-allowed; }

        /* SOHBET ARAYÜZÜ */
        .chat-interface {
            display: none;
            flex: 1;
            flex-direction: column;
            height: calc(100dvh - 50px);
            min-height: 0;
        }

        .chat-interface.active { display: flex; }

        .chat-header {
            background: #2d2d44;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #444;
            min-height: 45px;
            flex-shrink: 0;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .chat-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            flex-shrink: 0;
        }

        .chat-user-info {
            min-width: 0;
        }

        .chat-user-name {
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-online-count {
            font-size: 11px;
            color: #27ae60;
        }

        .chat-exit-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .messages-container {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .message {
            display: flex;
            gap: 7px;
            max-width: 85%;
            animation: msgAppear 0.3s ease;
            position: relative;
        }

        @keyframes msgAppear {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.own {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            cursor: pointer;
        }

        .message-body {
            max-width: 100%;
            min-width: 0;
        }

        .message-content {
            padding: 7px 11px;
            border-radius: 12px;
            background: #2d2d44;
            word-wrap: break-word;
            position: relative;
        }

        .message.own .message-content { background: #667eea; }

        .message-header {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 2px;
            flex-wrap: wrap;
        }

        .message-sender {
            font-size: 11px;
            font-weight: 600;
            color: #667eea;
            cursor: pointer;
        }

        .message.own .message-sender { color: #fff; }

        .message-time {
            font-size: 9px;
            color: rgba(255,255,255,0.5);
        }

        .message-text {
            font-size: 19px;
            line-height: 1.4;
            color: #fff;
            white-space: pre-wrap;
        }

        .message-image {
            max-width: 180px;
            max-height: 250px;
            border-radius: 12px;
            cursor: pointer;
            display: block;
            margin-top: 4px;
            pointer-events: auto;
            -webkit-user-drag: none;
            user-drag: none;
            object-fit: cover;
        }

        .message-video {
            max-width: 200px;
            max-height: 250px;
            border-radius: 12px;
            cursor: pointer;
            display: block;
            margin-top: 4px;
            object-fit: cover;
        }

        .message-sticker {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 4px;
            cursor: pointer;
            pointer-events: auto;
            -webkit-user-drag: none;
            user-drag: none;
        }

        .message-audio audio {
            width: 180px;
            height: 30px;
            margin-top: 4px;
        }

        .message-audio audio::-webkit-media-controls-download-button,
        .message-video::-webkit-media-controls-download-button {
            display: none !important;
        }

        .message-reactions {
            display: flex;
            gap: 3px;
            margin-top: 3px;
            flex-wrap: wrap;
        }

        .reaction-badge {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .message-reply-preview {
            border-left: 2px solid #667eea;
            padding-left: 6px;
            margin-bottom: 4px;
            font-size: 11px;
            color: #aaa;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            padding: 3px 6px;
            cursor: pointer;
        }

        .system-message {
            align-self: center;
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 11px;
            color: #ccc;
            font-style: italic;
        }

        /* Mesaj Context Menü */
        .context-menu {
            display: none;
            position: fixed;
            background: #2d2d44;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 5px 0;
            z-index: 11000;
            min-width: 150px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .context-menu.active { display: block; }

        .context-item {
            padding: 8px 15px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .context-item:hover { background: rgba(255,255,255,0.1); }
        .context-item.danger { color: #e74c3c; }

        /* Emoji Seçici */
        .reaction-picker {
            display: none;
            position: fixed;
            background: #2d2d44;
            border: 1px solid #444;
            border-radius: 20px;
            padding: 8px 12px;
            z-index: 12000;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .reaction-picker.active { display: flex; }

        .reaction-emoji {
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .reaction-emoji:hover { transform: scale(1.3); }

        /* Input Alanı */
        .input-area {
            padding: 8px 10px;
            background: #2d2d44;
            display: flex;
            gap: 6px;
            align-items: flex-end;
            border-top: 1px solid #444;
            flex-shrink: 0;
            flex-wrap: nowrap;
            overflow-x: auto;
        }

        .input-buttons {
            display: flex;
            gap: 3px;
            margin-bottom: 2px;
            flex-shrink: 0;
        }

        .input-btn {
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .input-btn:hover { background: rgba(255,255,255,0.1); }
        .input-btn.recording {
            background: #e74c3c;
            animation: recPulse 1s infinite;
        }

        @keyframes recPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .message-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #444;
            border-radius: 18px;
            background: #1a1a2e;
            color: #fff;
            outline: none;
            resize: none;
            max-height: 80px;
            font-size: 13px;
            line-height: 1.3;
            min-width: 0;
        }

        .message-input::placeholder { color: #666; }

        .send-btn {
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
        }

        .send-btn:disabled { background: #444; cursor: not-allowed; }

        /* Sticker Paneli */
        .sticker-panel {
            display: none;
            position: fixed;
            bottom: 60px;
            left: 10px;
            right: 10px;
            background: #2d2d44;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 10px;
            z-index: 9500;
            max-height: 200px;
            overflow-y: auto;
        }

        .sticker-panel.active { display: block; }

        .sticker-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .sticker-panel-title {
            font-size: 13px;
            font-weight: 600;
            color: #667eea;
        }

        .sticker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 8px;
        }

        .sticker-item {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border 0.2s;
            background: #1a1a2e;
        }

        .sticker-item:hover { border-color: #667eea; }
        .sticker-item.video-sticker { background: #000; }

        .sticker-create-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #1a1a2e;
            border: 2px dashed #667eea;
            color: #667eea;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Sticker Oluşturma Modal */
        .sticker-modal .modal-content {
            max-width: 400px;
        }

        .sticker-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 10px;
            display: block;
            border: 2px solid #667eea;
            background: #1a1a2e;
        }

        .sticker-preview-video {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 10px;
            display: block;
            border: 2px solid #667eea;
            background: #000;
        }

        /* Tam Ekran Medya */
        .fullscreen-media {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 13000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .fullscreen-media.active { display: flex; }

        .fullscreen-media img,
        .fullscreen-media video {
            max-width: 95%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 8px;
        }

        .fullscreen-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Profil Görüntüleme Modal */
        .profile-view-modal .modal-content {
            text-align: center;
        }

        .profile-view-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 10px;
            border: 2px solid #667eea;
            cursor: pointer;
        }

        .profile-view-avatar.large {
            width: 200px;
            height: 200px;
        }

        .profile-view-name {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
        }

        /* Blur Overlay + Şifre */
        .blur-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20000;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .blur-overlay.active { display: flex; }

        .blur-password-input {
            background: #1a1a2e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px 15px;
            color: #fff;
            font-size: 14px;
            outline: none;
            width: 200px;
            margin-top: 15px;
            text-align: center;
        }

        .blur-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .blur-subtitle {
            font-size: 13px;
            color: #ccc;
            margin-top: 5px;
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 4px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- ÜST BAR -->
    <div class="top-bar">
        <div class="top-bar-left">
            <span class="logo-text">Destek</span>
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Yardım ara..." autocomplete="off">
                <span class="search-icon">🔍</span>
            </div>
            <span class="online-indicator">
                <span class="online-dot"></span>
                <span id="onlineCount">0</span>
            </span>
        </div>
    </div>

    <!-- YILAN OYUNU -->
    <div class="game-container" id="gameContainer">
        <div class="game-header">
            <span class="score-display">Skor: <span id="score">0</span></span>
            <span class="best-score-display">Rekor: <span id="bestScore">0</span></span>
        </div>
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="game-overlay" id="startOverlay">
                <div class="overlay-title">🐍 Yılan Oyunu</div>
                <div class="overlay-subtitle">Hazır olduğunda başlat</div>
                <button class="btn btn-primary" onclick="startGame()">Başlat</button>
            </div>
            <div class="game-overlay hidden" id="gameOverOverlay">
                <div class="overlay-title" style="color:#e74c3c;">Oyun Bitti</div>
                <div class="overlay-score">Skor: <span id="finalScore">0</span></div>
                <button class="btn btn-primary" onclick="restartGame()">Tekrar Başlat</button>
            </div>
        </div>
        <div class="game-hint">Yön tuşları veya WASD ile oyna</div>
        <div class="mobile-controls">
            <div class="mobile-row">
                <button class="mobile-btn" onclick="changeDirection('up')">↑</button>
            </div>
            <div class="mobile-row">
                <button class="mobile-btn" onclick="changeDirection('left')">←</button>
                <button class="mobile-btn" onclick="changeDirection('down')">↓</button>
                <button class="mobile-btn" onclick="changeDirection('right')">→</button>
            </div>
        </div>
    </div>

    <!-- PROFİL MODAL -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <h2>Profil Oluştur</h2>
            <div class="form-group">
                <label>Profil Fotoğrafı</label>

    <script>
        // ============ SABİTLER ============
        const ROOM_CODE = 'efkaza7634';
        const LOCK_PASSWORD = 'efkaza7634';

        // ============ GLOBAL DEĞİŞKENLER ============
        let socket = null;
        let currentUser = null;
        let isInChat = false;
        let activeContextMessageId = null;
        let activeContextMessageElement = null;
        let replyToMessage = null;

        // ============ YILAN OYUNU ============
// ============ GELİŞMİŞ YILAN OYUNU (DÜZELTİLMİŞ) ============
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake = [{ x: 10, y: 10 }];
let direction = { x: 0, y: 0 };
let nextDirection = { x: 0, y: 0 };
let food = { x: 15, y: 15 };
let score = 0;
let bestScore = parseInt(localStorage.getItem('snakeBestScore')) || 0;
let gameRunning = false;
let gamePaused = false;
let gameLoop = null;
let gameSpeed = 150;
let hasStartedMoving = false;
let particles = [];
let foodPulse = 0;

// Yumuşak hareket için interpolasyon değişkenleri
let lastTime = 0;
let accumulator = 0;
let stepDelay = 150;
let currentStep = 0;
let totalSteps = 5;

document.getElementById('bestScore').textContent = bestScore;

function generateFood() {
    do {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 6; i++) {
        particles.push({
            x: x * gridSize + gridSize/2,
            y: y * gridSize + gridSize/2,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3,
            life: 15,
            maxLife: 15,
            color: color,
            size: 2 + Math.random() * 2
        });
    }
}

function updateParticles() {
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
    });
    particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawGame() {
    // Temiz arkaplan
    ctx.fillStyle = '#0d0d1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Yılan
    snake.forEach((seg, i) => {
        const x = seg.x * gridSize;
        const y = seg.y * gridSize;
        const size = gridSize - 2;
        
        if (i === 0) {
            // Baş
            ctx.fillStyle = '#667eea';
            ctx.shadowColor = '#667eea';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(x + gridSize/2, y + gridSize/2, size/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Gözler
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            if (direction.x === 1) {
                ctx.arc(x + 14, y + 6, 2.5, 0, Math.PI * 2);
                ctx.arc(x + 14, y + 14, 2.5, 0, Math.PI * 2);
            } else if (direction.x === -1) {
                ctx.arc(x + 5, y + 6, 2.5, 0, Math.PI * 2);
                ctx.arc(x + 5, y + 14, 2.5, 0, Math.PI * 2);
            } else if (direction.y === 1) {
                ctx.arc(x + 6, y + 14, 2.5, 0, Math.PI * 2);
                ctx.arc(x + 14, y + 14, 2.5, 0, Math.PI * 2);
            } else {
                ctx.arc(x + 6, y + 5, 2.5, 0, Math.PI * 2);
                ctx.arc(x + 14, y + 5, 2.5, 0, Math.PI * 2);
            }
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            if (direction.x === 1) {
                ctx.arc(x + 15, y + 6, 1.2, 0, Math.PI * 2);
                ctx.arc(x + 15, y + 14, 1.2, 0, Math.PI * 2);
            } else if (direction.x === -1) {
                ctx.arc(x + 4, y + 6, 1.2, 0, Math.PI * 2);
                ctx.arc(x + 4, y + 14, 1.2, 0, Math.PI * 2);
            } else if (direction.y === 1) {
                ctx.arc(x + 6, y + 15, 1.2, 0, Math.PI * 2);
                ctx.arc(x + 14, y + 15, 1.2, 0, Math.PI * 2);
            } else {
                ctx.arc(x + 6, y + 4, 1.2, 0, Math.PI * 2);
                ctx.arc(x + 14, y + 4, 1.2, 0, Math.PI * 2);
            }
            ctx.fill();
        } else {
            // Gövde
            const alpha = 1 - (i / snake.length) * 0.6;
            ctx.fillStyle = `rgba(85, 104, 211, ${alpha})`;
            ctx.beginPath();
            ctx.arc(x + gridSize/2, y + gridSize/2, size/2 - 1, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    // Elma
    foodPulse += 0.05;
    const pulseSize = Math.sin(foodPulse) * 1.5;
    
    ctx.shadowColor = '#e74c3c';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(
        food.x * gridSize + gridSize/2,
        food.y * gridSize + gridSize/2,
        gridSize/2 - 3 + pulseSize,
        0, Math.PI * 2
    );
    ctx.fill();
    ctx.shadowBlur = 0;
    
    // Sap
    ctx.strokeStyle = '#27ae60';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(food.x * gridSize + gridSize/2, food.y * gridSize + 3);
    ctx.lineTo(food.x * gridSize + gridSize/2 + 2, food.y * gridSize - 3);
    ctx.stroke();

    // Parçacıklar
    drawParticles();
}

function updateGame() {
    if (!gameRunning || gamePaused) return;
    if (!hasStartedMoving || (direction.x === 0 && direction.y === 0)) return;

    direction = { ...nextDirection };

    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
    
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        spawnParticles(snake[0].x, snake[0].y, '#e74c3c');
        endGame();
        return;
    }

    if (snake.some((seg, index) => index > 0 && seg.x === head.x && seg.y === head.y)) {
        spawnParticles(head.x, head.y, '#e74c3c');
        endGame();
        return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        spawnParticles(food.x, food.y, '#e74c3c');
        generateFood();
        if (gameSpeed > 60) {
            gameSpeed = Math.max(60, gameSpeed - 3);
        }
    } else {
        snake.pop();
    }

    updateParticles();
    drawGame();
}

function startGame() {
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('gameOverOverlay').classList.add('hidden');
    
    snake = [{ x: 10, y: 10 }];
    direction = { x: 0, y: 0 };
    nextDirection = { x: 0, y: 0 };
    score = 0;
    gameSpeed = 150;
    hasStartedMoving = false;
    gamePaused = false;
    particles = [];
    
    document.getElementById('score').textContent = score;
    generateFood();
    drawGame();
    
    if (gameLoop) clearInterval(gameLoop);
    gameRunning = true;
    
    // Otomatik başlatma YOK - sadece yön verilince başlar
}

function pauseGame() {
    if (!gameRunning || !hasStartedMoving) return;
    gamePaused = !gamePaused;
}

function restartGame() {
    startGame();
}

function endGame() {
    gameRunning = false;
    clearInterval(gameLoop);
    
    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('snakeBestScore', bestScore);
        document.getElementById('bestScore').textContent = bestScore;
    }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('gameOverOverlay').classList.remove('hidden');
}

function startMoving(newDir) {
    if (hasStartedMoving) return;
    direction = { ...newDir };
    nextDirection = { ...newDir };
    hasStartedMoving = true;
    if (gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(updateGame, gameSpeed);
}

function changeDirection(newDir) {
    if (!hasStartedMoving) return;
    
    const dirMap = {
        up: {x:0, y:-1}, down: {x:0, y:1},
        left: {x:-1, y:0}, right: {x:1, y:0}
    };
    const nd = dirMap[newDir];
    if (!nd) return;
    if (direction.x + nd.x === 0 && direction.y + nd.y === 0) return;
    nextDirection = nd;
}

// Klavye dinleyici - BASİT VE NET
document.addEventListener('keydown', (e) => {
    if (!gameRunning) return;
    
    const keyMap = {
        'ArrowUp': {x:0, y:-1}, 'w': {x:0, y:-1}, 'W': {x:0, y:-1},
        'ArrowDown': {x:0, y:1}, 's': {x:0, y:1}, 'S': {x:0, y:1},
        'ArrowLeft': {x:-1, y:0}, 'a': {x:-1, y:0}, 'A': {x:-1, y:0},
        'ArrowRight': {x:1, y:0}, 'd': {x:1, y:0}, 'D': {x:1, y:0}
    };
    
    const newDir = keyMap[e.key];
    if (!newDir) return;
    e.preventDefault();
    
    if (!hasStartedMoving) {
        startMoving(newDir);
    } else {
        if (direction.x + newDir.x === 0 && direction.y + newDir.y === 0) return;
        nextDirection = newDir;
    }
});

// Dokunmatik
let touchStartX = null, touchStartY = null;

canvas.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    e.preventDefault();
});

canvas.addEventListener('touchmove', (e) => {
    if (!touchStartX || !touchStartY) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    
    if (Math.abs(dx) > 15 || Math.abs(dy) > 15) {
        const newDir = Math.abs(dx) > Math.abs(dy)
            ? (dx > 0 ? {x:1, y:0} : {x:-1, y:0})
            : (dy > 0 ? {x:0, y:1} : {x:0, y:-1});
        
        if (!hasStartedMoving) {
            startMoving(newDir);
        } else {
            if (direction.x + newDir.x === 0 && direction.y + newDir.y === 0) return;
            nextDirection = newDir;
        }
        touchStartX = null;
        touchStartY = null;
    }
    e.preventDefault();
});

canvas.addEventListener('touchend', () => {
    touchStartX = null;
    touchStartY = null;
});

        // ============ ARKA PLAN KİLİDİ ============
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isInChat) {
                showBlurLock();
            }
        });

        function showBlurLock() {
            document.getElementById('blurOverlay').classList.add('active');
            document.getElementById('blurPassword').value = '';
            document.getElementById('blurPassword').focus();
        }

        document.getElementById('blurPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (e.target.value === LOCK_PASSWORD) {
                    document.getElementById('blurOverlay').classList.remove('active');
                } else {
                    e.target.value = '';
                }
            }
        });

        // ============ PROFİL YÖNETİMİ ============
        function checkProfile() {
            const saved = localStorage.getItem('chatProfile');
            if (saved) {
                currentUser = JSON.parse(saved);
                showChat();
            } else {
                showProfileModal();
            }
        }

        function showProfileModal() {
            document.getElementById('profileModal').classList.add('active');
            document.getElementById('nameInput').focus();
        }

        function saveProfile() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) { alert('İsim gerekli'); return; }
            const photo = document.getElementById('photoPreview').src || '';
            currentUser = { name, photo };
            localStorage.setItem('chatProfile', JSON.stringify(currentUser));
            document.getElementById('profileModal').classList.remove('active');
            showChat();
        }

        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) { alert('Fotoğraf 5MB altı olmalı'); return; }
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('photoPreview').src = ev.target.result;
                document.getElementById('photoPreview').style.display = 'block';
            };
            reader.readAsDataURL(file);
        });

        // ============ SOHBET ============
        function connectSocket() {
            const url = window.location.hostname === 'localhost' ? 'http://localhost:10000' : window.location.origin;
            socket = io(url, { transports: ['websocket','polling'], timeout: 30000, reconnectionAttempts: 5 });

            socket.on('connect', () => { console.log('✅ Bağlandı'); joinChatRoom(); });
            socket.on('message', (msg) => { displayMessage(msg); });
            socket.on('message-deleted', (data) => { removeMessageFromDOM(data.messageId); });
            socket.on('message-reaction', (data) => { updateMessageReaction(data.messageId, data.emoji, data.userName); });
            socket.on('user-list-update', (users) => {
                document.getElementById('onlineCount').textContent = users.length;
                document.getElementById('chatOnlineCount').textContent = `Çevrimiçi: ${users.length}`;
            });
            socket.on('user-joined', (d) => addSystemMessage(`${d.userName} sohbete katıldı`));
            socket.on('user-left', (d) => addSystemMessage(`${d.userName} sohbetten ayrıldı`));
            socket.on('disconnect', () => console.log('🔌 Koptu'));
        }

        function joinChatRoom() {
            if (!socket || !currentUser) return;
            socket.emit('join-chat', { roomCode: ROOM_CODE, userName: currentUser.name, userPhoto: currentUser.photo });
        }

        function showChat() {
            isInChat = true;
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('chatInterface').classList.add('active');
            document.getElementById('chatAvatar').src = currentUser.photo || '';
            document.getElementById('chatUserName').textContent = currentUser.name;
            if (!socket) connectSocket(); else if (socket.connected) joinChatRoom();
            document.getElementById('messageInput').focus();
        }

        function exitChat() {
            isInChat = false;
            document.getElementById('chatInterface').classList.remove('active');
            document.getElementById('gameContainer').style.display = 'flex';
            if (socket) { socket.disconnect(); socket = null; }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !socket) return;
            const payload = { type: 'text', text };
            if (replyToMessage) {
                payload.replyTo = replyToMessage.id;
                payload.replyToUserName = replyToMessage.userName;
                payload.replyToText = replyToMessage.text;
            }
            socket.emit('message', payload);
            input.value = '';
            input.style.height = 'auto';
            replyToMessage = null;
            input.focus();
        }

        function displayMessage(msg) {
            const container = document.getElementById('messagesContainer');
            const isOwn = msg.userName === currentUser?.name;
            const div = document.createElement('div');
            div.className = `message ${isOwn ? 'own' : ''}`;
            div.dataset.messageId = msg.id;

            let content = '';
            if (msg.replyTo) {
                content += `<div class="message-reply-preview" onclick="scrollToMessage('${msg.replyTo}')">↩️ ${escapeHtml(msg.replyToUserName)}: ${escapeHtml(msg.replyToText || '')}</div>`;
            }
            if (msg.type === 'text') {
                content += `<div class="message-text">${escapeHtml(msg.text)}</div>`;
            } else if (msg.type === 'image') {
                content += `<div class="message-text">${msg.text ? escapeHtml(msg.text) : ''}</div>
                <img src="${msg.fileData}" class="message-image" alt="Fotoğraf" onclick="openFullscreenImage('${msg.fileData}')">`;
            } else if (msg.type === 'video') {
                content += `<div class="message-text">${msg.text ? escapeHtml(msg.text) : ''}</div>
                <video src="${msg.fileData}" class="message-video" controls controlsList="nodownload" onclick="openFullscreenVideo('${msg.fileData}')"></video>`;
            } else if (msg.type === 'sticker') {
                if (msg.stickerType === 'video') {
                    content += `<video src="${msg.fileData}" class="message-sticker" autoplay muted loop playsinline></video>`;
                } else {
                    content += `<img src="${msg.fileData}" class="message-sticker" alt="Sticker">`;
                }
            } else if (msg.type === 'audio') {
                content += `<div class="message-audio"><audio controls controlsList="nodownload" preload="metadata"><source src="${msg.fileData}" type="${msg.mimeType || 'audio/webm'}"></audio></div>`;
            }

            if (msg.reactions && msg.reactions.length > 0) {
                content += `<div class="message-reactions">`;
                msg.reactions.forEach(r => {
                    content += `<span class="reaction-badge">${r.emoji} ${r.count > 1 ? r.count : ''}</span>`;
                });
                content += `</div>`;
            }

            div.innerHTML = `
                <img src="${msg.userPhoto || ''}" class="message-avatar" alt="${msg.userName}" onclick="showProfile('${msg.userName}', '${msg.userPhoto}')">
                <div class="message-body">
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-sender" onclick="showProfile('${msg.userName}', '${msg.userPhoto}')">${escapeHtml(msg.userName)}</span>
                            <span class="message-time">${msg.time}</span>
                        </div>
                        ${content}
                    </div>
                </div>
            `;

            // Uzun basma - context menü
            div.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                showContextMenu(e.clientX, e.clientY, msg.id, div);
            });
            // Mobil uzun basma
            let longPressTimer;
            div.addEventListener('touchstart', (e) => {
                longPressTimer = setTimeout(() => {
                    showContextMenu(e.touches[0].clientX, e.touches[0].clientY, msg.id, div);
                }, 500);
            });
            div.addEventListener('touchend', () => clearTimeout(longPressTimer));
            div.addEventListener('touchmove', () => clearTimeout(longPressTimer));

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function removeMessageFromDOM(messageId) {
            const el = document.querySelector(`[data-message-id="${messageId}"]`);
            if (el) el.remove();
        }

        function updateMessageReaction(messageId, emoji, userName) {
            const el = document.querySelector(`[data-message-id="${messageId}"]`);
            if (!el) return;
            const contentEl = el.querySelector('.message-content');
            let reactionsDiv = contentEl.querySelector('.message-reactions');
            if (!reactionsDiv) {
                reactionsDiv = document.createElement('div');
                reactionsDiv.className = 'message-reactions';
                contentEl.appendChild(reactionsDiv);
            }
            let badge = reactionsDiv.querySelector(`[data-emoji="${emoji}"]`);
            if (!badge) {
                badge = document.createElement('span');
                badge.className = 'reaction-badge';
                badge.dataset.emoji = emoji;
                badge.textContent = emoji;
                reactionsDiv.appendChild(badge);
            } else {
                badge.textContent = `${emoji} ${parseInt(badge.textContent.slice(emoji.length) || 1) + 1}`;
            }
        }

        function addSystemMessage(text) {
            const container = document.getElementById('messagesContainer');
            const d = document.createElement('div');
            d.className = 'system-message';
            d.textContent = text;
            container.appendChild(d);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(t) {
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        // ============ CONTEXT MENÜ ============
        function showContextMenu(x, y, msgId, element) {
            activeContextMessageId = msgId;
            activeContextMessageElement = element;
            const menu = document.getElementById('contextMenu');
            menu.style.left = Math.min(x, window.innerWidth - 160) + 'px';
            menu.style.top = Math.min(y, window.innerHeight - 120) + 'px';
            menu.classList.add('active');
        }

        document.addEventListener('click', () => {
            document.getElementById('contextMenu').classList.remove('active');
            document.getElementById('reactionPicker').classList.remove('active');
        });

        document.getElementById('contextMenu').addEventListener('click', (e) => e.stopPropagation());

        function contextReply() {
            const msg = findMessageById(activeContextMessageId);
            if (msg) {
                replyToMessage = msg;
                document.getElementById('messageInput').focus();
            }
            document.getElementById('contextMenu').classList.remove('active');
        }

        function contextReact() {
            const menu = document.getElementById('contextMenu');
            const rect = menu.getBoundingClientRect();
            const picker = document.getElementById('reactionPicker');
            picker.style.left = rect.left + 'px';
            picker.style.top = rect.top - 50 + 'px';
            picker.classList.add('active');
            menu.classList.remove('active');
        }

        function contextDelete() {
            if (activeContextMessageId && socket) {
                socket.emit('delete-message', { messageId: activeContextMessageId });
            }
            document.getElementById('contextMenu').classList.remove('active');
        }

        function findMessageById(id) {
            // Mesaj verisi sadece DOM'da değil, server'da tutuluyor. Burada basitçe DOM'dan alınır.
            const el = document.querySelector(`[data-message-id="${id}"]`);
            if (!el) return null;
            const sender = el.querySelector('.message-sender')?.textContent;
            const text = el.querySelector('.message-text')?.textContent;
            return { id, userName: sender, text };
        }

        function addReaction(emoji) {
            if (activeContextMessageId && socket) {
                socket.emit('react-message', { messageId: activeContextMessageId, emoji });
            }
            document.getElementById('reactionPicker').classList.remove('active');
        }

        function scrollToMessage(messageId) {
            const el = document.querySelector(`[data-message-id="${messageId}"]`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ============ DOSYA GÖNDERME ============
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (file.size > 5 * 1024 * 1024) { alert('Fotoğraf 5MB altı olmalı'); return; }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    socket.emit('message', { type: 'image', fileData: ev.target.result });
                };
                reader.readAsDataURL(file);
            });
            this.value = '';
        });

        document.getElementById('videoInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (file.size > 20 * 1024 * 1024) { alert('Video 20MB altı olmalı'); return; }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    socket.emit('message', { type: 'video', fileData: ev.target.result, mimeType: file.type });
                };
                reader.readAsDataURL(file);
            });
            this.value = '';
        });

        // ============ SES KAYDI ============
        let mediaRecorder = null, audioChunks = [], isRecording = false;

        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            if (isRecording) { stopRecording(); return; }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount:1, sampleRate:48000, echoCancellation:true, noiseSuppression:true } });
                let mimeType = 'audio/webm';
                if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
                else if (MediaRecorder.isTypeSupported('audio/ogg')) mimeType = 'audio/ogg';
                mediaRecorder = new MediaRecorder(stream, { mimeType });
                audioChunks = [];
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: mimeType });
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        socket.emit('message', { type: 'audio', fileData: ev.target.result, mimeType });
                    };
                    reader.readAsDataURL(blob);
                    stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start(100);
                isRecording = true;
                btn.classList.add('recording');
                btn.textContent = '⏹';
            } catch(e) { console.error(e); alert('Mikrofon erişimi reddedildi'); }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                isRecording = false;
                const btn = document.getElementById('recordBtn');
                btn.classList.remove('recording');
                btn.textContent = '🎤';
            }
        }

        // ============ STICKER ============
        let stickerFile = null;
        let stickerPreviewData = null;
        let stickerPreviewType = null;

        function toggleStickerPanel() {
            const panel = document.getElementById('stickerPanel');
            panel.classList.toggle('active');
            if (panel.classList.contains('active')) loadStickers();
        }

        function loadStickers() {
            const grid = document.getElementById('stickerGrid');
            grid.innerHTML = '<button class="sticker-create-btn" onclick="openStickerModal()">+</button>';
            const stickers = JSON.parse(localStorage.getItem('stickers') || '[]');
            stickers.forEach(s => {
                const el = document.createElement(s.type === 'video' ? 'video' : 'img');
                el.src = s.data;
                el.className = 'sticker-item';
                if (s.type === 'video') { el.autoplay = true; el.muted = true; el.loop = true; }
                el.onclick = () => sendSticker(s);
                grid.appendChild(el);
            });
        }

        function openStickerModal() {
            document.getElementById('stickerPanel').classList.remove('active');
            document.getElementById('stickerModal').classList.add('active');
            stickerFile = null;
            stickerPreviewData = null;
            stickerPreviewType = null;
            document.getElementById('stickerPreviewContainer').style.display = 'none';
            document.getElementById('stickerPreviewArea').innerHTML = '';
        }

        function closeStickerModal() {
            document.getElementById('stickerModal').classList.remove('active');
            stickerFile = null;
        }

        function previewSticker(file) {
            if (!file) return;
            stickerFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                stickerPreviewData = e.target.result;
                stickerPreviewType = file.type.startsWith('video') ? 'video' : 'image';
                const area = document.getElementById('stickerPreviewArea');
                if (stickerPreviewType === 'video') {
                    area.innerHTML = `<video src="${stickerPreviewData}" class="sticker-preview-video" autoplay muted loop playsinline></video>`;
                } else {
                    area.innerHTML = `<img src="${stickerPreviewData}" class="sticker-preview" alt="Sticker">`;
                }
                document.getElementById('stickerPreviewContainer').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function saveSticker() {
            if (!stickerPreviewData) { alert('Önce dosya seç'); return; }
            const stickers = JSON.parse(localStorage.getItem('stickers') || '[]');
            stickers.push({ id: Date.now().toString(), type: stickerPreviewType, data: stickerPreviewData });
            localStorage.setItem('stickers', JSON.stringify(stickers));
            closeStickerModal();
            toggleStickerPanel();
        }

        function sendSticker(sticker) {
            if (socket) {
                socket.emit('message', { type: 'sticker', stickerType: sticker.type, fileData: sticker.data });
            }
            document.getElementById('stickerPanel').classList.remove('active');
        }

        // ============ PROFİL GÖRÜNTÜLEME ============
        function showProfile(userName, userPhoto) {
            document.getElementById('profileViewAvatar').src = userPhoto || '';
            document.getElementById('profileViewName').textContent = userName;
            document.getElementById('profileViewAvatar').classList.remove('large');
            document.getElementById('profileViewModal').classList.add('active');
        }

        function showProfileFromHeader() {
            showProfile(currentUser.name, currentUser.photo);
        }

        function toggleAvatarSize() {
            document.getElementById('profileViewAvatar').classList.toggle('large');
        }

        function closeProfileView() {
            document.getElementById('profileViewModal').classList.remove('active');
        }

        // ============ TAM EKRAN MEDYA ============
        function openFullscreenImage(src) {
            const content = document.getElementById('fullscreenContent');
            content.innerHTML = `<img src="${src}" alt="Fotoğraf">`;
            document.getElementById('fullscreenMedia').classList.add('active');
        }

        function openFullscreenVideo(src) {
            const content = document.getElementById('fullscreenContent');
            content.innerHTML = `<video src="${src}" controls autoplay></video>`;
            document.getElementById('fullscreenMedia').classList.add('active');
        }

        function closeFullscreen() {
            document.getElementById('fullscreenMedia').classList.remove('active');
            document.getElementById('fullscreenContent').innerHTML = '';
        }

        // ============ GİRİŞ ============
        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = e.target.value.trim().toLowerCase();
                if (val === ROOM_CODE) {
                    e.target.value = '';
                    checkProfile();
                } else {
                    e.target.value = '';
                }
            }
        });

        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 80) + 'px';
        });

        // ============ BAŞLANGIÇ ============
        document.addEventListener('DOMContentLoaded', () => {
            generateFood();
            drawGame();
        });
    </script>
</body>
