<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destek Merkezi</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background: #1a1a2e; 
            color: #fff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ÜST BAR */
        .top-bar {
            background: #2d2d44;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #444;
            z-index: 100;
            min-height: 50px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .logo-text {
            font-weight: 600;
            font-size: 16px;
            color: #667eea;
            white-space: nowrap;
        }

        .search-container {
            flex: 1;
            max-width: 400px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 8px 35px 8px 15px;
            border: 1px solid #444;
            border-radius: 20px;
            background: #1a1a2e;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            pointer-events: none;
            opacity: 0.6;
        }

        .online-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #27ae60;
            white-space: nowrap;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: #27ae60;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* YILAN OYUNU */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .game-header {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 600;
        }

        .score-display {
            color: #667eea;
        }

        .best-score-display {
            color: #f39c12;
        }

        .canvas-wrapper {
            position: relative;
            background: #000;
            border-radius: 10px;
            border: 2px solid #333;
            overflow: hidden;
            max-width: 100%;
            max-height: 70vh;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            max-width: 500px;
            max-height: 70vh;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .game-over-overlay.active {
            display: flex;
        }

        .game-over-text {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #e74c3c;
        }

        .final-score {
            font-size: 20px;
            margin-bottom: 20px;
            color: #fff;
        }

        .restart-btn {
            background: #667eea;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .restart-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .restart-btn:active {
            transform: translateY(0);
        }

        .game-hint {
            margin-top: 15px;
            color: #666;
            font-size: 13px;
            text-align: center;
        }

        /* MOBİL KONTROLLER */
        .mobile-controls {
            display: none;
            margin-top: 15px;
            gap: 5px;
        }

        .mobile-btn {
            width: 50px;
            height: 50px;
            background: #2d2d44;
            border: 1px solid #444;
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .mobile-btn:active {
            background: #667eea;
        }

        .mobile-row {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        }

        @media (min-width: 769px) {
            .mobile-controls {
                display: none;
            }
        }

        /* PROFİL MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2d2d44;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid #444;
        }

        .modal h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #ccc;
            font-size: 13px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        .form-input:focus {
            border-color: #667eea;
        }

        .photo-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: block;
            object-fit: cover;
            border: 2px solid #667eea;
            cursor: pointer;
            background: #1a1a2e;
        }

        .photo-btn {
            width: 100%;
            padding: 8px;
            background: #1a1a2e;
            border: 1px dashed #444;
            border-radius: 8px;
            color: #ccc;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            transition: all 0.2s;
        }

        .photo-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-primary:disabled {
            background: #444;
            cursor: not-allowed;
        }

        /* SOHBET ARAYÜZÜ */
        .chat-interface {
            display: none;
            flex: 1;
            flex-direction: column;
            height: calc(100vh - 50px);
        }

        .chat-interface.active {
            display: flex;
        }

        .chat-header {
            background: #2d2d44;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #444;
            min-height: 45px;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
        }

        .chat-user-name {
            font-weight: 600;
            font-size: 14px;
        }

        .chat-online-count {
            font-size: 12px;
            color: #27ae60;
        }

        .chat-exit-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .chat-exit-btn:hover {
            background: #c0392b;
        }

        .messages-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            gap: 8px;
            max-width: 85%;
            animation: msgAppear 0.3s ease;
        }

        @keyframes msgAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.own {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .message-content {
            padding: 8px 12px;
            border-radius: 12px;
            background: #2d2d44;
            max-width: 100%;
            word-wrap: break-word;
        }

        .message.own .message-content {
            background: #667eea;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
        }

        .message-sender {
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
        }

        .message.own .message-sender {
            color: #fff;
        }

        .message-time {
            font-size: 10px;
            color: rgba(255,255,255,0.5);
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
            color: #fff;
        }

        .message-image {
            max-width: 200px;
            max-height: 250px;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            margin-top: 5px;
            pointer-events: none;
            -webkit-user-drag: none;
            user-drag: none;
        }

        .message-audio {
            margin-top: 5px;
        }

        .message-audio audio {
            width: 200px;
            height: 35px;
        }

        .message-audio audio::-webkit-media-controls-download-button {
            display: none !important;
        }

        .message-audio audio::-webkit-media-controls-enclosure {
            overflow: hidden;
        }

        .message-audio audio::-webkit-media-controls-panel {
            width: calc(100% + 30px);
        }

        .system-message {
            align-self: center;
            background: rgba(255,255,255,0.1);
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 12px;
            color: #ccc;
            font-style: italic;
        }

        .input-area {
            padding: 10px 15px;
            background: #2d2d44;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            border-top: 1px solid #444;
        }

        .input-buttons {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .input-btn {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .input-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .input-btn.recording {
            background: #e74c3c;
            animation: recPulse 1s infinite;
        }

        @keyframes recPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .message-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #444;
            border-radius: 20px;
            background: #1a1a2e;
            color: #fff;
            outline: none;
            resize: none;
            max-height: 100px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message-input::placeholder {
            color: #666;
        }

        .send-btn {
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #5568d3;
        }

        .send-btn:disabled {
            background: #444;
            cursor: not-allowed;
        }

        /* Scrollbar */
        .messages-container::-webkit-scrollbar {
            width: 5px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body>
    <!-- ÜST BAR -->
    <div class="top-bar">
        <div class="top-bar-left">
            <span class="logo-text">Destek</span>
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Yardım ara..." autocomplete="off">
                <span class="search-icon">🔍</span>
            </div>
            <span class="online-indicator">
                <span class="online-dot"></span>
                <span id="onlineCount">0</span>
            </span>
        </div>
    </div>

    <!-- YILAN OYUNU -->
    <div class="game-container" id="gameContainer">
        <div class="game-header">
            <span class="score-display">Skor: <span id="score">0</span></span>
            <span class="best-score-display">Rekor: <span id="bestScore">0</span></span>
        </div>
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="game-over-overlay" id="gameOverOverlay">
                <div class="game-over-text">Oyun Bitti</div>
                <div class="final-score">Skor: <span id="finalScore">0</span></div>
                <button class="restart-btn" onclick="restartGame()">Tekrar Başlat</button>
            </div>
        </div>
        <div class="game-hint">Yön tuşları veya WASD ile oyna</div>
        <div class="mobile-controls">
            <div class="mobile-row">
                <button class="mobile-btn" onclick="changeDirection('up')">↑</button>
            </div>
            <div class="mobile-row">
                <button class="mobile-btn" onclick="changeDirection('left')">←</button>
                <button class="mobile-btn" onclick="changeDirection('down')">↓</button>
                <button class="mobile-btn" onclick="changeDirection('right')">→</button>
            </div>
        </div>
    </div>

    <!-- PROFİL MODAL -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <h2>Profil Oluştur</h2>
            <div class="form-group">
                <label>Profil Fotoğrafı</label>
                <img src="" class="photo-preview" id="photoPreview" alt="Profil" style="display: none;">
                <input type="file" id="photoInput" accept="image/*" style="display: none;">
                <button class="photo-btn" onclick="document.getElementById('photoInput').click()">
                    📷 Galeriden Seç
                </button>
            </div>
            <div class="form-group">
                <label>İsmin</label>
                <input type="text" class="form-input" id="nameInput" placeholder="İsmini gir..." maxlength="20">
            </div>
            <button class="btn-primary" id="saveProfileBtn" onclick="saveProfile()">Tamam</button>
        </div>
    </div>

    <!-- SOHBET ARAYÜZÜ -->
    <div class="chat-interface" id="chatInterface">
        <div class="chat-header">
            <div class="chat-header-left">
                <img src="" class="chat-avatar" id="chatAvatar" alt="Avatar">
                <div>
                    <div class="chat-user-name" id="chatUserName">Kullanıcı</div>
                    <div class="chat-online-count" id="chatOnlineCount">Çevrimiçi: 0</div>
                </div>
            </div>
            <button class="chat-exit-btn" onclick="exitChat()">Çıkış</button>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="input-area">
            <div class="input-buttons">
                <button class="input-btn" onclick="document.getElementById('imageInput').click()" title="Fotoğraf Gönder">📷</button>
                <button class="input-btn" id="recordBtn" onclick="toggleRecording()" title="Ses Kaydı">🎤</button>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </div>
            <textarea class="message-input" id="messageInput" placeholder="Mesaj yaz..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        // ============ GLOBAL DEĞİŞKENLER ============
        const ROOM_CODE = 'efkaza7634';
        let socket = null;
        let currentUser = null;
        let isInChat = false;

        // ============ YILAN OYUNU ============
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 }
        ];
        let direction = { x: 0, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('snakeBestScore')) || 0;
        let gameRunning = false;
        let gameLoop = null;
        let gameSpeed = 100;

        document.getElementById('bestScore').textContent = bestScore;

        function generateFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
        }

        function drawGame() {
            // Arkaplan
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Yılan
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#667eea' : '#5568d3';
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
                ctx.strokeStyle = '#1a1a2e';
                ctx.lineWidth = 1;
                ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Elma
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        function updateGame() {
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Duvara çarpma kontrolü
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // Kendine çarpma kontrolü
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // Elma yeme kontrolü
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                generateFood();
                if (gameSpeed > 50) {
                    gameSpeed -= 2;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(updateGame, gameSpeed);
                }
            } else {
                snake.pop();
            }

            drawGame();
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('snakeBestScore', bestScore);
                document.getElementById('bestScore').textContent = bestScore;
            }
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverOverlay').classList.add('active');
        }

        function restartGame() {
            snake = [{ x: 10, y: 10 }];
            direction = { x: 0, y: 0 };
            score = 0;
            gameSpeed = 100;
            document.getElementById('score').textContent = score;
            document.getElementById('gameOverOverlay').classList.remove('active');
            generateFood();
            drawGame();
            
            if (gameLoop) clearInterval(gameLoop);
            gameRunning = true;
            gameLoop = setInterval(updateGame, gameSpeed);
        }

        function changeDirection(newDirection) {
            const dirMap = {
                'up': { x: 0, y: -1 },
                'down': { x: 0, y: 1 },
                'left': { x: -1, y: 0 },
                'right': { x: 1, y: 0 }
            };

            const newDir = dirMap[newDirection];
            if (!newDir) return;

            // Ters yöne gidemez
            if (direction.x + newDir.x === 0 && direction.y + newDir.y === 0) return;

            direction = newDir;
        }

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    changeDirection('up');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    changeDirection('down');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    changeDirection('left');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    changeDirection('right');
                    break;
            }
        });

        // Dokunmatik kaydırma
        let touchStartX = null;
        let touchStartY = null;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!touchStartX || !touchStartY) return;

            const touchEndX = e.touches[0].clientX;
            const touchEndY = e.touches[0].clientY;

            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 20) changeDirection('right');
                else if (dx < -20) changeDirection('left');
            } else {
                if (dy > 20) changeDirection('down');
                else if (dy < -20) changeDirection('up');
            }

            touchStartX = null;
            touchStartY = null;
            e.preventDefault();
        });

        canvas.addEventListener('touchend', () => {
            touchStartX = null;
            touchStartY = null;
        });

        // ============ SOHBET SİSTEMİ ============
        function connectSocket() {
            const serverUrl = window.location.hostname === 'localhost'
                ? 'http://localhost:10000'
                : window.location.origin;

            socket = io(serverUrl, {
                transports: ['websocket', 'polling'],
                timeout: 30000,
                reconnectionAttempts: 5,
                reconnectionDelay: 2000
            });

            socket.on('connect', () => {
                console.log('✅ Bağlandı');
                joinChatRoom();
            });

            socket.on('message', (msg) => {
                displayMessage(msg);
            });

            socket.on('user-list-update', (users) => {
                const onlineCount = users.length;
                document.getElementById('onlineCount').textContent = onlineCount;
                document.getElementById('chatOnlineCount').textContent = `Çevrimiçi: ${onlineCount}`;
            });

            socket.on('user-joined', (data) => {
                addSystemMessage(`${data.userName} sohbete katıldı`);
            });

            socket.on('user-left', (data) => {
                addSystemMessage(`${data.userName} sohbetten ayrıldı`);
            });

            socket.on('disconnect', () => {
                console.log('🔌 Bağlantı koptu');
            });

            socket.on('connect_error', (error) => {
                console.error('❌ Bağlantı hatası:', error);
            });
        }

        function joinChatRoom() {
            if (!socket || !currentUser) return;

            socket.emit('join-chat', {
                roomCode: ROOM_CODE,
                userName: currentUser.name,
                userPhoto: currentUser.photo
            });
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text || !socket) return;

            socket.emit('message', {
                type: 'text',
                text: text
            });

            input.value = '';
            input.style.height = 'auto';
            input.focus();
        }

        function displayMessage(msg) {
            const container = document.getElementById('messagesContainer');
            const isOwn = msg.userName === currentUser?.name;

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isOwn ? 'own' : ''}`;

            let contentHtml = '';

            if (msg.type === 'text') {
                contentHtml = `<div class="message-text">${escapeHtml(msg.text)}</div>`;
            } else if (msg.type === 'image') {
                contentHtml = `
                    <div class="message-text">${msg.text ? escapeHtml(msg.text) : ''}</div>
                    <img src="${msg.fileData}" class="message-image" alt="Fotoğraf">
                `;
            } else if (msg.type === 'audio') {
                contentHtml = `
                    <div class="message-text">${msg.text ? escapeHtml(msg.text) : ''}</div>
                    <div class="message-audio">
                        <audio controls controlsList="nodownload" preload="metadata">
                            <source src="${msg.fileData}" type="${msg.mimeType || 'audio/webm'}">
                        </audio>
                    </div>
                `;
            }

            msgDiv.innerHTML = `
                <img src="${msg.userPhoto || ''}" class="message-avatar" alt="${msg.userName}">
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-sender">${escapeHtml(msg.userName)}</span>
                        <span class="message-time">${msg.time}</span>
                    </div>
                    ${contentHtml}
                </div>
            `;

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function addSystemMessage(text) {
            const container = document.getElementById('messagesContainer');
            const sysDiv = document.createElement('div');
            sysDiv.className = 'system-message';
            sysDiv.textContent = text;
            container.appendChild(sysDiv);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============ SES KAYDI ============
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        async function toggleRecording() {
            const recordBtn = document.getElementById('recordBtn');

            if (isRecording) {
                stopRecording();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        channelCount: 1,
                        sampleRate: 48000,
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });

                // Tarayıcıya uygun format seç
                let mimeType = 'audio/webm';
                if (MediaRecorder.isTypeSupported('audio/mp4')) {
                    mimeType = 'audio/mp4';
                } else if (MediaRecorder.isTypeSupported('audio/ogg')) {
                    mimeType = 'audio/ogg';
                }

                mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: mimeType });
                    sendAudioMessage(audioBlob, mimeType);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start(100);
                isRecording = true;
                recordBtn.classList.add('recording');
                recordBtn.textContent = '⏹';

            } catch (error) {
                console.error('❌ Ses kaydı hatası:', error);
                alert('Mikrofon erişimi reddedildi!');
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                isRecording = false;
                
                const recordBtn = document.getElementById('recordBtn');
                recordBtn.classList.remove('recording');
                recordBtn.textContent = '🎤';
            }
        }

        function sendAudioMessage(audioBlob, mimeType) {
            const reader = new FileReader();
            reader.onload = (e) => {
                socket.emit('message', {
                    type: 'audio',
                    fileData: e.target.result,
                    mimeType: mimeType
                });
            };
            reader.readAsDataURL(audioBlob);
        }

        // ============ FOTOĞRAF GÖNDERME ============
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                alert('Fotoğraf 5MB\'dan küçük olmalı!');
                return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                socket.emit('message', {
                    type: 'image',
                    fileData: event.target.result
                });
            };
            reader.readAsDataURL(file);

            this.value = '';
        });

        // ============ PROFİL YÖNETİMİ ============
        function checkProfile() {
            const savedProfile = localStorage.getItem('chatProfile');
            if (savedProfile) {
                currentUser = JSON.parse(savedProfile);
                showChat();
            } else {
                showProfileModal();
            }
        }

        function showProfileModal() {
            document.getElementById('profileModal').classList.add('active');
            document.getElementById('nameInput').focus();
        }

        function saveProfile() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('Lütfen ismini gir!');
                return;
            }

            const photoPreview = document.getElementById('photoPreview');
            const photo = photoPreview.src || '';

            currentUser = {
                name: name,
                photo: photo
            };

            localStorage.setItem('chatProfile', JSON.stringify(currentUser));
            document.getElementById('profileModal').classList.remove('active');
            
            showChat();
        }

        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                alert('Fotoğraf 5MB\'dan küçük olmalı!');
                return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                const preview = document.getElementById('photoPreview');
                preview.src = event.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        });

        function showChat() {
            isInChat = true;
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('chatInterface').classList.add('active');
            
            document.getElementById('chatAvatar').src = currentUser.photo || '';
            document.getElementById('chatUserName').textContent = currentUser.name;
            
            if (!socket) {
                connectSocket();
            } else if (socket.connected) {
                joinChatRoom();
            }

            document.getElementById('messageInput').focus();
        }

        function exitChat() {
            isInChat = false;
            document.getElementById('chatInterface').classList.remove('active');
            document.getElementById('gameContainer').style.display = 'flex';
            
            if (socket) {
                socket.disconnect();
                socket = null;
            }
        }

        // ============ ARAMA ÇUBUĞU ============
        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const value = e.target.value.trim().toLowerCase();
                
                if (value === ROOM_CODE) {
                    e.target.value = '';
                    checkProfile();
                } else {
                    e.target.value = '';
                    // Yanlış kod - sadece input'u temizle
                }
            }
        });

        // ============ MESAJ INPUT ENTER ============
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // ============ BAŞLANGIÇ ============
        document.addEventListener('DOMContentLoaded', () => {
            // Yılan oyununu başlat
            generateFood();
            drawGame();
            gameRunning = true;
            gameLoop = setInterval(updateGame, gameSpeed);
        });
    </script>
</body>
</html>
