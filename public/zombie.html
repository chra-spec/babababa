//=========================================================================================== Gamepad API
//Modified from: https://gist.github.com/videlais/8110000
// Modified by Xander Luciano
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);//swap out button on mobile
class GamePad {
  constructor() {
    this.supported =
      (navigator.webkitGetGamepads && navigator.webkitGetGamepads()) ||
      !!navigator.webkitGamepads ||
      !!navigator.mozGamepads ||
      !!navigator.msGamepads ||
      !!navigator.gamepads ||
      (navigator.getGamepads && navigator.getGamepads());

    this.ticking = false;

    // Initialize pan, roll, and buttons
    this.pan = new THREE.Vector3(0, 0, 0);
    this.roll = new THREE.Vector3(0, 0, 0);
    this.btn = new THREE.Vector3(0, 0, 0); // needed for .set()

    this.RIGHT_AXIS_THRESHOLD = 7849 / 32767.0;
    this.LEFT_AXIS_THRESHOLD = 8689 / 32767.0;
    this.TRIGGER_AXIS_THRESHOLD = 30 / 32767.0;

    this.SPACEMOUSE_THRESHOLD = 5 / 32767.0;

    this.gamepads = [];
    this.prevRawGamepadTypes = [];
    this.prevTimestamps = [];

    this.init();
  }

  init() {
    if (this.supported) {
      // Older Firefox
      window.addEventListener(
        "MozGamepadConnected",
        e => this.onGamepadConnect(e),
        false
      );
      window.addEventListener(
        "MozGamepadDisconnected",
        e => this.onGamepadDisconnect(e),
        false
      );

      // W3C Specification
      window.addEventListener(
        "gamepadconnected",
        e => this.onGamepadConnect(e),
        false
      );
      window.addEventListener(
        "gamepaddisconnected",
        e => this.onGamepadDisconnect(e),
        false
      );

      // Chrome / CocoonJS
      if ((navigator.webkitGetGamepads && navigator.webkitGetGamepads()) || (navigator.getGamepads && navigator.getGamepads())) {
        this.startPolling();
      }
    } else {
      console.log("Gamepad API not supported or not detected!");
    }
  }

  startPolling() {
    console.log("Gamepad Controller Connected!");
    if (!this.ticking) {
      this.ticking = true;
      this.update();
    }
  }

  stopPolling() {
    alert("Gamepad Controller Disconnected!");
    this.ticking = false;
  }

  update() {
    this.pollStatus();
    if (this.ticking) {
      this.pollJoysticks();
      // You can add requestAnimationFrame here if needed
    }
  }

  pollStatus() {
    this.pollGamepads();
    for (let i in this.gamepads) {
      let gamepad = this.gamepads[i];
      if (gamepad.timestamp && gamepad.timestamp === this.prevTimestamps[i]) continue;
      this.prevTimestamps[i] = gamepad.timestamp;
    }
  }

  pollGamepads() {
    let rawGamepads =
      (navigator.webkitGetGamepads && navigator.webkitGetGamepads()) ||
      navigator.webkitGamepads ||
      navigator.mozGamepads ||
      navigator.msGamepads ||
      navigator.gamepads ||
      (navigator.getGamepads && navigator.getGamepads());

    if (rawGamepads) {
      this.gamepads = [];
      for (let i = 0, max = rawGamepads.length; i < max; i++) {
        if (typeof rawGamepads[i] !== this.prevRawGamepadTypes[i]) {
          this.prevRawGamepadTypes[i] = typeof rawGamepads[i];
        }
        if (rawGamepads[i]) this.gamepads.push(rawGamepads[i]);
      }
    }
  }

  pollJoysticks() {
    const pad = 0;

    // Reset inputs without reassigning
    this.pan.set(0, 0, 0);
    this.roll.set(0, 0, 0);
    this.btn.set(0, 0, 0); // this.btn.x/y/z will be overwritten below

    if (!this.gamepads[pad]) return;

    const gp = this.gamepads[pad];

    let panX = gp.axes[0];
    let panY = gp.axes[1];
    let panZ = gp.axes[2];

    let rollX = gp.axes[3];
    let rollY = gp.axes[4];
    let rollZ = gp.axes[5];

    // **Store full button objects so .pressed works**
    this.btn.y = gp.buttons[0]; // A
    this.btn.x = gp.buttons[1]; // B
    this.btn.z = gp.buttons[isMobile ? 2 : 3];//swap buttons on mobile
    // -------------------------
    // Apply deadzone
    const DEADZONE = 0.15;

    const applyDeadzone = (value, threshold = DEADZONE) => {
      if (Math.abs(value) < threshold) return 0;
      return (value - Math.sign(value) * threshold) / (1 - threshold);
    };

    this.pan.x = applyDeadzone(panX);
    this.pan.y = applyDeadzone(panY);
    this.pan.z = applyDeadzone(panZ);

    this.roll.x = applyDeadzone(rollX);
    this.roll.y = applyDeadzone(rollY);
    this.roll.z = applyDeadzone(rollZ);
  }

  onGamepadConnect(event) {
    console.log(event);
    let gamepad = event.gamepad;
    this.gamepads[event.gamepad.id] = gamepad;
    this.startPolling();
  }

  onGamepadDisconnect(event) {
    this.gamepads[event.gamepad.id] = null;
    if (this.gamepads.length === 0) this.stopPolling();
  }
}

function resizeMinimap() {
  const isMobile = window.innerWidth < 768;
  const size = Math.min(window.innerWidth, window.innerHeight) * 0.32;   // UI size
  const viewSize = isMobile ? 35 : 50; // world zoom level

  // Resize container

  container.style.height = size + "px";

  // Resize renderer
  miniRenderer.setSize(size, size);

  // Adjust orthographic camera zoom (VERY IMPORTANT)
  miniMapCamera.left   = -viewSize;
  miniMapCamera.right  =  viewSize;
  miniMapCamera.top    =  viewSize;
  miniMapCamera.bottom = -viewSize;

  miniMapCamera.updateProjectionMatrix();
}

  }
);





//===================================================== add model
let treeModel = null;
const treeLoader = new THREE.GLTFLoader();

treeLoader.load(
  "https://raw.githubusercontent.com/Data-Bee38/models/main/dead_tree.glb",
  function (gltf) {

    gltf.scene.traverse(function (node) {
      if (node.isMesh) {
        node.castShadow = true;

        node.material = new THREE.MeshPhongMaterial({
          color: new THREE.Color("#111"),
          specular: new THREE.Color("#222"),
          shininess: 0,
          side: THREE.DoubleSide
        });

        const edges = new THREE.EdgesGeometry(node.geometry);
        const lineMat = new THREE.LineBasicMaterial({ color: new THREE.Color("white"), transparent: true, opacity: .15 });
        const outline = new THREE.LineSegments(edges, lineMat);
        node.add(outline);
      }
    });

    treeModel = gltf.scene;

    // ✅ SPAWN TREES ONLY AFTER LOADED
    createTreeCluster(0, 0, 0);
 


  }
);




function createTreeCluster(
  centerX,
  centerY,
  centerZ,
  options = {}
) {
  if (!treeModel) return;

  // ===== DEFAULT SETTINGS =====
  const {
    count = 15,
    baseRadius = 50,
    radialJitterRange = 35,
    zScatterRange = 45,
    minScale = 2.5,
    maxScale = 3.5
  } = options;

  for (let i = 0; i < count; i++) {

    // ---- Circle placement ----
    const angle = (i / count) * Math.PI * 2;

    const radialJitter = randnum(-radialJitterRange, radialJitterRange);
    const zScatter = randnum(-zScatterRange, zScatterRange);

    const r = baseRadius + radialJitter;

    const x = centerX + Math.cos(angle) * r;
    const z = centerZ + Math.sin(angle) * r + zScatter;
    const y = centerY;

    const scale = randnum(minScale, maxScale);
    const rotationY = Math.random() * Math.PI * 2;

    // =============================
    // THREE TREE
    // =============================
    const tree = treeModel.clone(true);

    tree.position.set(x, y, z);
    tree.rotation.y = rotationY;
    tree.scale.set(scale, scale, scale);

    scene.add(tree);

    // =============================
    // PLAYER COLLISION
    // =============================
    const trunkRadius = 1.5 * scale;
    const trunkWidth = 1.5 * scale;     // adjust to match trunk thickness
    const trunkHeight = 12 * scale;   // trunk height
    const trunkDepth = 3 * scale;

    palmCylinders.push({
      position: tree.position,
      radius: trunkRadius/2,
      height: trunkHeight
    });

  }
}

// BEGIN: SAFE PATCH - ensure render loop + aim/shoot handlers
// ======================================================

(function(){
  // Guarded refs
  const getSafe = name => (window[name] !== undefined ? window[name] : null);

  const _renderer = getSafe('renderer');
  const _scene = getSafe('scene');
  const _camera = getSafe('camera');
  const _miniRenderer = getSafe('miniRenderer');
  const _miniMapCamera = getSafe('miniMapCamera');
  const _tiltRoot = getSafe('tiltRoot');
  const _beam = (function(){ try { return typeof beam !== 'undefined' ? beam : null; } catch(e){ return null; } })();
  const _crosshair = document.getElementById('crosshair');
  const _aimBtn = document.getElementById('aimBtn');
  const _shootBtn = document.getElementById('shootBtn');

  // Start a simple render loop if one isn't already running.
  if (_renderer && _scene && _camera) {
    if (!window.__zombie_fixed_animate_started) {
      window.__zombie_fixed_animate_started = true;
      function __zombie_fixed_animate() {
        requestAnimationFrame(__zombie_fixed_animate);
        try {
          _renderer.render(_scene, _camera);
        } catch (e) {
          // swallow render errors so we don't stop the loop
          console.warn('render error', e);
        }
        if (_miniRenderer && _miniMapCamera && _scene) {
          try { _miniRenderer.render(_scene, _miniMapCamera); } catch(e) { /* ignore */ }
        }
      }
      __zombie_fixed_animate();
      console.log('zombie: fallback render loop started');
    }
  } else {
    console.warn('zombie: renderer/scene/camera not found — render loop not started');
  }

  // Simple aiming state + visual feedback
  let isAiming = false;
  function setAiming(on) {
    isAiming = !!on;
    // show/hide crosshair
    if (_crosshair) _crosshair.style.opacity = isAiming ? '1' : '0.9';
    // small camera zoom effect if camera is a PerspectiveCamera
    try {
      if (_camera && _camera.isPerspectiveCamera) {
        if (!_camera.userFov) _camera.userFov = _camera.fov || 45;
        _camera.fov = isAiming ? Math.max(20, (_camera.userFov) - 15) : (_camera.userFov);
        _camera.updateProjectionMatrix();
      }
    } catch (e) { /* ignore */ }
    // add CSS feedback on aim button
    if (_aimBtn) _aimBtn.style.background = isAiming ? 'rgba(255,255,255,0.12)' : '';
  }

  // Attach aim button safely
  if (_aimBtn) {
    _aimBtn.addEventListener('click', (e) => {
      setAiming(!isAiming);
    }, { passive: true });
    // ensure pointer events enabled
    _aimBtn.style.pointerEvents = 'auto';
  } else {
    // fallback: attach to any element with id 'aimBtn' missing — nothing
    console.log('zombie: aimBtn not present in DOM');
  }

  // Shoot behavior: brief beam or flash
  if (_shootBtn) {
    _shootBtn.addEventListener('click', (e) => {
      // use existing beam if available
      if (_beam && _beam.material) {
        try {
          _beam.material.opacity = 1;
          setTimeout(() => {
            if (_beam && _beam.material) _beam.material.opacity = 0;
          }, 120);
        } catch (err) { /* ignore */ }
      } else {
        // fallback flash: momentarily change background to simulate shot
        const old = document.body.style.backgroundColor;
        document.body.style.backgroundColor = '#111';
        setTimeout(()=> document.body.style.backgroundColor = old, 80);
      }
      // simple console feedback
      console.log('zombie: shoot triggered');
    }, { passive: true });
    _shootBtn.style.pointerEvents = 'auto';
  } else {
    console.log('zombie: shootBtn not present in DOM');
  }

  // Ensure info button/modal don't throw if missing elements
  const _infoButton = document.getElementById('infoButton');
  const _controlsModal = document.getElementById('controlsModal');
  const _closeModal = document.getElementById('closeModal');
  if (_infoButton && _controlsModal) {
    _infoButton.addEventListener('click', ()=> { _controlsModal.style.display = 'flex'; }, { passive: true });
    if (_closeModal) _closeModal.addEventListener('click', ()=> { _controlsModal.style.display = 'none'; }, { passive: true });
    _controlsModal.addEventListener('click', (e)=> { if (e.target === _controlsModal) _controlsModal.style.display = 'none'; }, { passive: true });
  }

  // Make sure canvases are visible and sized correctly (guarded)
  try {
    if (_renderer && _renderer.domElement) {
      _renderer.domElement.style.display = 'block';
    }
    if (_miniRenderer && _miniRenderer.domElement) {
      _miniRenderer.domElement.style.display = 'block';
    }
  } catch(e){}

  // Expose helper on window for debugging
  window.__zombie_fix = {
    setAiming,
    isAiming: ()=> isAiming
  };

})();

// ======================================================
// END: SAFE PATCH
// ======================================================

</script>
