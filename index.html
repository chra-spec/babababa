<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Llama 3.3 · Groq</title>
  <style>
    /* --- STİLLER (ÖNEMLİ DEĞİL) --- */
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b0b14;color:#e5e5e5;height:100vh;display:flex;justify-content:center;align-items:center;padding:10px}
    .app{max-width:1000px;width:100%;height:96vh;background:#151525;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,0.8);display:flex;flex-direction:column;overflow:hidden;border:1px solid #2a2a42}
    .header{padding:14px 22px;background:#1a1a30;border-bottom:1px solid #2a2a42;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;flex-shrink:0}
    .header h1{font-size:18px;font-weight:600;background:linear-gradient(135deg,#7c5cfc,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .status{font-size:12px;padding:4px 14px;border-radius:30px;background:#10b98120;color:#10b981;border:1px solid #10b98140}
    .status.loading{color:#fbbf24;border-color:#fbbf2440;background:#fbbf2420}
    .status.error{color:#ef4444;border-color:#ef444440;background:#ef444420}
    .chat{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px;background:#0f0f1e;scroll-behavior:smooth}
    .chat::-webkit-scrollbar{width:5px}
    .chat::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:10px}
    .msg{max-width:88%;padding:12px 16px;border-radius:14px;line-height:1.6;font-size:14px;white-space:pre-wrap;word-wrap:break-word;animation:fadeIn 0.35s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .msg.user{align-self:flex-end;background:#1e3a6a;color:#fff;border-bottom-right-radius:4px}
    .msg.ai{align-self:flex-start;background:#1a1a2e;border:1px solid #2a2a4a;border-bottom-left-radius:4px}
    .msg .label{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:#8888aa;margin-bottom:4px;font-weight:600}
    .msg.ai .label{color:#8b7cf7}
    .msg .content code{background:#00000050;padding:2px 8px;border-radius:4px;font-size:13px}
    .msg .content pre{background:#00000050;padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0;border:1px solid #2a2a4a}
    .msg .content pre code{background:transparent;padding:0}
    .input-area{padding:14px 22px;background:#1a1a30;border-top:1px solid #2a2a42;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
    .input-row{display:flex;gap:10px;align-items:flex-end}
    .input-row textarea{flex:1;background:#0b0b18;border:1px solid #2a2a4a;color:#e5e5e5;padding:10px 14px;border-radius:14px;resize:vertical;min-height:52px;max-height:160px;font-family:inherit;font-size:14px;line-height:1.5;transition:0.25s}
    .input-row textarea:focus{outline:none;border-color:#7c5cfc;box-shadow:0 0 0 3px #7c5cfc30}
    .input-row textarea::placeholder{color:#666}
    .btn{padding:10px 22px;border:none;border-radius:14px;font-weight:600;font-size:14px;cursor:pointer;transition:0.25s;min-height:48px;white-space:nowrap;flex-shrink:0}
    .btn-primary{background:#7c5cfc;color:#fff}
    .btn-primary:hover:not(:disabled){background:#9b7cfc;transform:scale(1.02)}
    .btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
    .btn-danger{background:#dc2626;color:#fff}
    .btn-danger:hover{background:#b91c1c}
    .input-options{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:#8888aa}
    .input-options label{display:flex;align-items:center;gap:4px}
    .input-options input[type="number"]{width:60px;background:#0b0b18;border:1px solid #2a2a4a;color:#e5e5e5;padding:4px 8px;border-radius:8px;font-size:12px}
    .token-counter{margin-left:auto;font-size:12px;color:#666}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid #7c5cfc40;border-top-color:#7c5cfc;border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:600px){.msg{max-width:95%;font-size:13px;padding:10px 12px}.btn{padding:8px 14px;font-size:12px;min-height:40px}.header h1{font-size:15px}.chat{padding:12px 14px}.input-area{padding:10px 14px}.input-options{font-size:11px}}
  </style>
</head>
<body>

<div class="app">
  <header class="header">
    <h1>🧠 Llama 3.3 · Groq</h1>
    <span class="status" id="status">● Hazır</span>
  </header>

  <div class="chat" id="chatArea">
    <div class="msg ai">
      <div class="label">🧑‍💻 Asistan</div>
      <div class="content">Merhaba! Kodlama asistanıyım. Ne yapmak istersin?</div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="promptInput" rows="2" placeholder="Kod yaz veya soru sor..."></textarea>
      <button class="btn btn-primary" id="sendBtn">➤ Gönder</button>
      <button class="btn btn-danger" id="clearBtn">✕ Temizle</button>
    </div>
    <div class="input-options">
      <label>Max Token: <input type="number" id="maxTokens" value="1024" min="64" max="4096" /></label>
      <label><input type="checkbox" id="autoContinue" checked /> Otomatik Devam</label>
      <span class="token-counter" id="tokenCounter">📝 0 token</span>
    </div>
  </div>
</div>

<script>
  (function() {
    'use strict';

    // ============================================================
    // 🔑 Groq API Key
    // ============================================================
    const GROQ_KEY = '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';
    // ============================================================

    const API_URL = 'https://api.groq.com/openai/v1/chat/completions';
    const MODEL = 'llama-3.3-70b-versatile';

    // --- DOM ELEMANLARI ---
    const chatArea = document.getElementById('chatArea');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const maxTokensInput = document.getElementById('maxTokens');
    const autoContinue = document.getElementById('autoContinue');
    const tokenCounter = document.getElementById('tokenCounter');

    // --- DURUM ---
    let isProcessing = false;
    let conversation = [];

    // --- YARDIMCI FONKSİYONLAR ---
    function setStatus(text, type = '') {
      statusEl.textContent = text;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function estimateTokens(t) { return Math.ceil((t || '').length / 4); }

    function updateCounter(text) {
      tokenCounter.textContent = '📝 ' + estimateTokens(text) + ' token';
    }

    // --- MESAJ EKLEME (ROLE GÜVENCESİ) ---
    function addMessage(role, content) {
      // Sadece geçerli role değerlerine izin ver
      const validRoles = ['user', 'assistant', 'system'];
      const safeRole = validRoles.includes(role) ? role : 'user';

      const div = document.createElement('div');
      div.className = 'msg ' + safeRole;
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = safeRole === 'user' ? '👤 Sen' : '🧑‍💻 Asistan';
      const contentDiv = document.createElement('div');
      contentDiv.className = 'content';
      contentDiv.textContent = content;
      div.appendChild(label);
      div.appendChild(contentDiv);
      chatArea.appendChild(div);

      // Konuşma geçmişine ekle (role güvenli)
      conversation.push({ role: safeRole, content: content });
      setTimeout(() => div.scrollIntoView({ behavior: 'smooth', block: 'end' }), 80);

      const total = conversation.map(m => m.content).join(' ');
      updateCounter(total);
      return div;
    }

    function addLoading() {
      const div = document.createElement('div');
      div.className = 'msg ai';
      div.id = 'loadingMsg';
      div.innerHTML = `<div class="label">🧑‍💻 Asistan</div><div class="content"><span class="spinner"></span> Düşünüyor...</div>`;
      chatArea.appendChild(div);
      div.scrollIntoView({ behavior: 'smooth', block: 'end' });
      return div;
    }

    function removeLoading() {
      const el = document.getElementById('loadingMsg');
      if (el) el.remove();
    }

    // --- API ÇAĞRISI (ZORLA DOĞRULAMA) ---
    async function callModel(messages, maxTokens) {
      // 1. Tüm mesajları temizle: sadece 'role' ve 'content' al
      const cleanedMessages = messages.map(msg => {
        // Geçersiz role varsa 'user' yap
        let role = msg.role;
        if (!['user', 'assistant', 'system'].includes(role)) {
          role = 'user';
        }
        return { role: role, content: String(msg.content || '') };
      });

      // 2. İlk mesaj system değilse ekle (opsiyonel)
      if (cleanedMessages.length === 0 || cleanedMessages[0].role !== 'system') {
        cleanedMessages.unshift({
          role: 'system',
          content: 'Sen yardımcı bir asistansın. Türkçe cevap ver.'
        });
      }

      const payload = {
        model: MODEL,
        messages: cleanedMessages,
        max_tokens: maxTokens || 1024,
        temperature: 0.7,
        top_p: 0.9,
      };

      const resp = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + GROQ_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const text = await resp.text();
      if (!resp.ok) {
        throw new Error('API Hatası ' + resp.status + ': ' + text);
      }

      let data;
      try { data = JSON.parse(text); } catch (e) {
        throw new Error('JSON Hatası: ' + text.slice(0, 200));
      }
      if (data.error) throw new Error(data.error.message || 'API hatası');
      return data.choices?.[0]?.message?.content || 'Yanıt alınamadı';
    }

    // --- MESAJ GÖNDER ---
    async function sendMessage() {
      if (isProcessing) return;

      const userText = promptInput.value.trim();
      if (!userText) {
        setStatus('⚠️ Mesaj girin', 'error');
        setTimeout(() => setStatus('● Hazır', ''), 1500);
        return;
      }

      // Kullanıcı mesajını ekle (güvenli)
      addMessage('user', userText);
      promptInput.value = '';
      promptInput.style.height = 'auto';

      isProcessing = true;
      sendBtn.disabled = true;
      setStatus('⏳ Asistan yanıtlıyor...', 'loading');

      const maxTok = parseInt(maxTokensInput.value) || 1024;
      // Son 20 mesajı al (token sınırı için)
      const history = conversation.slice(-20);

      try {
        addLoading();
        const response = await callModel(history, maxTok);
        removeLoading();

        if (response) {
          addMessage('assistant', response);
          setStatus('✅ Tamam', '');
          const est = estimateTokens(response);
          if (autoContinue.checked && est >= maxTok * 0.85) {
            setStatus('🔄 Otomatik devam...', 'loading');
            setTimeout(() => {
              promptInput.value = 'Devam et, kaldığın yerden tamamla.';
              sendMessage();
            }, 600);
          }
        } else {
          addMessage('assistant', '⚠️ Yanıt boş geldi.');
          setStatus('⚠️ Boş yanıt', 'error');
        }
      } catch (err) {
        removeLoading();
        setStatus('❌ ' + err.message, 'error');
        addMessage('assistant', '❌ Hata: ' + err.message);
      } finally {
        isProcessing = false;
        sendBtn.disabled = false;
        if (!isProcessing) setStatus('● Hazır', '');
        promptInput.focus();
      }
    }

    // --- SOHBETİ TEMİZLE ---
    function clearChat() {
      if (conversation.length === 0) return;
      if (!confirm('Sohbet geçmişi silinsin mi?')) return;
      chatArea.innerHTML = '';
      conversation = [];
      addMessage('assistant', '🧹 Sohbet temizlendi. Yeniden başlayalım!');
      setStatus('● Hazır', '');
      updateCounter('');
      promptInput.focus();
    }

    // --- OLAY DİNLEYİCİLERİ ---
    sendBtn.addEventListener('click', sendMessage);
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    promptInput.addEventListener('input', () => {
      promptInput.style.height = 'auto';
      promptInput.style.height = promptInput.scrollHeight + 'px';
      updateCounter(promptInput.value);
    });
    clearBtn.addEventListener('click', clearChat);

    // --- BAŞLANGIÇ ---
    if (!GROQ_KEY || GROQ_KEY === 'gsk_xxxxxxxxxxxx') {
      setStatus('❌ Groq Key gerekli!', 'error');
    }
    updateCounter('');
    promptInput.focus();
    console.log('🚀 Llama 3.3 70B (Groq) hazır.');
  })();
</script>

</body>
</html>
